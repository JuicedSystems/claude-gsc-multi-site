<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Search Console Multi-Site Connector icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2330"/><stop offset="1" stop-color="#14181f"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- spokes to three properties -->
  <g stroke="#6ea8ff" stroke-width="22" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M300 300 L190 190"/><path d="M300 300 L300 150"/><path d="M300 300 L150 300"/>
  </g>
  <g fill="#6ea8ff"><circle cx="190" cy="190" r="34"/><circle cx="300" cy="150" r="34"/><circle cx="150" cy="300" r="34"/></g>
  <!-- magnifier lens with rising bars -->
  <circle cx="470" cy="470" r="230" fill="#14181f" stroke="#6ea8ff" stroke-width="56"/>
  <g fill="#6ea8ff">
    <rect x="360" y="510" width="52" height="90" rx="10"/>
    <rect x="444" y="440" width="52" height="160" rx="10"/>
    <rect x="528" y="360" width="52" height="240" rx="10"/>
  </g>
  <!-- handle: the connector -->
  <path d="M640 640 L830 830" stroke="#d97757" stroke-width="96" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="40" fill="#d97757"/>
</svg>
