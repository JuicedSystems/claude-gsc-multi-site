      <rect x="44" y="154" width="6" height="8" rx="1"/><rect x="54" y="148" width="6" height="14" rx="1"/><rect x="64" y="140" width="6" height="22" rx="1"/>
      <rect x="68" y="232" width="6" height="8" rx="1"/><rect x="78" y="226" width="6" height="14" rx="1"/><rect x="88" y="218" width="6" height="22" rx="1"/>
