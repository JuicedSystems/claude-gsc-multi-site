<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Setup in four steps: 1 install the plugin, 2 create a Google OAuth client once, 3 sign in to each Google account, 4 ask Claude about every site">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14181f"/><stop offset="1" stop-color="#1c2330"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="270" rx="18"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6ea8ff"/></marker>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="270" fill="url(#bg)"/>
    <rect width="1200" height="6" fill="#6ea8ff"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <!-- card 1 -->
      <rect x="32" y="40" width="250" height="196" rx="14" fill="#1c2330" stroke="#2c3646" stroke-width="2"/>
      <circle cx="68" cy="78" r="20" fill="#6ea8ff"/><text x="68" y="85" text-anchor="middle" font-size="20" font-weight="700" fill="#14181f">1</text>
      <text x="100" y="86" font-size="22" font-weight="700" fill="#f4f5f7">Install</text>
      <text x="56" y="126" font-size="15" fill="#b6bdc9">Two commands in Claude</text>
      <text x="56" y="148" font-size="15" fill="#b6bdc9">Code, Cowork or Desktop.</text>
      <rect x="56" y="170" width="202" height="42" rx="8" fill="#14181f"/>
      <text x="70" y="196" font-family="Consolas, Menlo, monospace" font-size="13" fill="#6ea8ff">/plugin install …</text>

      <!-- card 2 -->
      <rect x="322" y="40" width="250" height="196" rx="14" fill="#1c2330" stroke="#2c3646" stroke-width="2"/>
      <circle cx="358" cy="78" r="20" fill="#6ea8ff"/><text x="358" y="85" text-anchor="middle" font-size="20" font-weight="700" fill="#14181f">2</text>
      <text x="390" y="86" font-size="22" font-weight="700" fill="#f4f5f7">OAuth client</text>
      <text x="346" y="126" font-size="15" fill="#b6bdc9">Your own Google Cloud</text>
      <text x="346" y="148" font-size="15" fill="#b6bdc9">Desktop client. Once.</text>
      <rect x="346" y="170" width="202" height="42" rx="8" fill="#14181f"/>
      <text x="360" y="196" font-size="14" fill="#d97757" font-weight="600">≈ 10 min · one time</text>

      <!-- card 3 -->
      <rect x="612" y="40" width="250" height="196" rx="14" fill="#1c2330" stroke="#2c3646" stroke-width="2"/>
      <circle cx="648" cy="78" r="20" fill="#6ea8ff"/><text x="648" y="85" text-anchor="middle" font-size="20" font-weight="700" fill="#14181f">3</text>
      <text x="680" y="86" font-size="22" font-weight="700" fill="#f4f5f7">Sign in</text>
      <text x="636" y="126" font-size="15" fill="#b6bdc9">One link per Google</text>
      <text x="636" y="148" font-size="15" fill="#b6bdc9">account. Repeat for each.</text>
      <g transform="translate(646 172)">
        <circle cx="18" cy="18" r="17" fill="#14181f" stroke="#6ea8ff" stroke-width="3"/><circle cx="18" cy="14" r="6" fill="#6ea8ff"/><path d="M7 30 a11 9 0 0 1 22 0" fill="#6ea8ff"/>
        <circle cx="66" cy="18" r="17" fill="#14181f" stroke="#6ea8ff" stroke-width="3"/><circle cx="66" cy="14" r="6" fill="#6ea8ff"/><path d="M55 30 a11 9 0 0 1 22 0" fill="#6ea8ff"/>
        <circle cx="114" cy="18" r="17" fill="#14181f" stroke="#6ea8ff" stroke-width="3"/><circle cx="114" cy="14" r="6" fill="#6ea8ff"/><path d="M103 30 a11 9 0 0 1 22 0" fill="#6ea8ff"/>
        <text x="150" y="25" font-size="18" font-weight="700" fill="#b6bdc9">+</text>
      </g>

      <!-- card 4 -->
      <rect x="902" y="40" width="266" height="196" rx="14" fill="#1c2330" stroke="#d97757" stroke-width="2"/>
      <circle cx="938" cy="78" r="20" fill="#d97757"/><text x="938" y="85" text-anchor="middle" font-size="20" font-weight="700" fill="#14181f">4</text>
      <text x="970" y="86" font-size="22" font-weight="700" fill="#f4f5f7">Ask Claude</text>
      <text x="926" y="126" font-size="15" fill="#b6bdc9">Every property, every</text>
      <text x="926" y="148" font-size="15" fill="#b6bdc9">account, one list.</text>
      <g transform="translate(926 168)" fill="#6ea8ff">
        <rect x="0" y="30" width="22" height="16" rx="3"/><rect x="30" y="20" width="22" height="26" rx="3"/><rect x="60" y="8" width="22" height="38" rx="3"/><rect x="90" y="0" width="22" height="46" rx="3" fill="#d97757"/>
        <text x="126" y="34" font-family="Consolas, Menlo, monospace" font-size="13" fill="#b6bdc9">/gsc-report</text>
      </g>
    </g>

    <g stroke="#6ea8ff" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M286 138 L316 138"/><path d="M576 138 L606 138"/><path d="M866 138 L896 138"/>
    </g>
  </g>
</svg>
